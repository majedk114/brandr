[project]
name = "brandr-agent"
version = "0.1.0"
description = "Autonomous social media manager agent: plan, create, schedule, publish, analyze, improve."
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40"]

[project.scripts]
brandr = "brandr_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["brandr_agent"]
