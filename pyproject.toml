[project]
name = "genx-studio"
version = "0.2.0"
description = "Genx Studio: نظام إدارة محفظة حسابات سوشيال ميديا، كل حساب مشروع معزول."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
genx = "genx.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["genx"]
